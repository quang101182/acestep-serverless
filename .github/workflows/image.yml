name: Construire et publier l'image

# Rien n'est construit sur le PC de Quang : GitHub fournit la machine, et l'image part directement
# vers ghcr.io. Declenche a la main, ou a chaque changement du Dockerfile / du handler.
on:
  workflow_dispatch:
    inputs:
      acestep_ref:
        description: "Commit ou branche d'ACE-Step a figer dans l'image"
        default: main
  push:
    branches: [main, master]
    paths: ["Dockerfile", "handler.py", ".github/workflows/image.yml"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # ⚠ NE PAS ajouter « maximize-build-space » ici. Mesure du 20/09 sur ce depot : un runner
      # ubuntu-latest a deja **87 Go libres sur /**, et cette action prend justement cet espace libre
      # pour en faire un volume monte AILLEURS — alors que buildkit ecrit dans /var/lib/docker, reste
      # sur /. Resultat : « no space left on device » des la 2e etape. L'action a CAUSE la panne
      # qu'elle devait eviter. Le conseil « un runner n'a que 14 Go » est perime.
      - uses: actions/checkout@v4

      - name: Place disponible
        run: df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            ACESTEP_REF=${{ inputs.acestep_ref || 'main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/acestep-serverless:latest
            ghcr.io/${{ github.repository_owner }}/acestep-serverless:${{ github.run_number }}

      - name: Place restante
        if: always()
        run: df -h /
